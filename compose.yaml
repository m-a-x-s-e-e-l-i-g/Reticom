name: reticom

services:
  language-model:
    image: ollama/ollama:0.33.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - language-models:/root/.ollama
    environment:
      OLLAMA_NO_CLOUD: "1"

  command:
    build: .
    image: reticom:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RETICOM_COMMAND_PORT:-8780}:8780"
      - "${RETICOM_TCP_BIND:-127.0.0.1}:${RETICOM_TCP_PORT:-4242}:4242"
    volumes:
      - command-data:/var/lib/reticom
    environment:
      RETICOM_LOCAL_PORT_FORWARD: "1"
      RETICOM_AI_URL: http://language-model:11434
      RETICOM_AI_MODEL: qwen3:4b-instruct
      RETIUM_TRANSCRIPTION_MODEL: ${RETIUM_TRANSCRIPTION_MODEL:-base}
      RETIUM_TRANSCRIPTION_LANGUAGE: ${RETIUM_TRANSCRIPTION_LANGUAGE:-en}

  field:
    image: reticom:local
    pull_policy: never
    command: ["field"]
    environment:
      RETICOM_LOCAL_PORT_FORWARD: "1"
    init: true
    restart: unless-stopped
    depends_on:
      command:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RETICOM_FIELD_PORT:-8781}:8780"
    volumes:
      - field-data:/var/lib/reticom

volumes:
  language-models:
  command-data:
  field-data:
