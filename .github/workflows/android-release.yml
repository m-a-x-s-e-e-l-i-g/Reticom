name: Android APK release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Python 3.11 for Chaquopy
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve Android version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must use vMAJOR.MINOR.PATCH, for example v0.2.0." >&2
            exit 2
          fi

          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( minor > 999 || patch > 999 )); then
            echo "MINOR and PATCH must be between 0 and 999." >&2
            exit 2
          fi

          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Derived Android versionCode is outside the supported range." >&2
            exit 2
          fi

          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "apk=Reticom-Field-${version}-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run browser logic tests
        run: node --test tests/*.test.mjs

      - name: Build tagged APK
        working-directory: android
        env:
          RETIUM_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug \
            -PreticomVersionName="${{ steps.version.outputs.name }}" \
            -PreticomVersionCode="${{ steps.version.outputs.code }}"

      - name: Package APK and checksum
        shell: bash
        env:
          APK_NAME: ${{ steps.version.outputs.apk }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: reticom-field-${{ steps.version.outputs.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Reticom $VERSION" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
