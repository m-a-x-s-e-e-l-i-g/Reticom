name: reticom

services:
  command:
    build: .
    image: reticom:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RETICOM_COMMAND_PORT:-8780}:8780"
      - "${RETICOM_TCP_BIND:-127.0.0.1}:${RETICOM_TCP_PORT:-4242}:4242"
    volumes:
      - command-data:/var/lib/reticom
    environment:
      RETIUM_TRANSCRIPTION_MODEL: ${RETIUM_TRANSCRIPTION_MODEL:-base}
      RETIUM_TRANSCRIPTION_LANGUAGE: ${RETIUM_TRANSCRIPTION_LANGUAGE:-en}

  field:
    image: reticom:local
    pull_policy: never
    command: ["field"]
    init: true
    restart: unless-stopped
    depends_on:
      command:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RETICOM_FIELD_PORT:-8781}:8780"
    volumes:
      - field-data:/var/lib/reticom

volumes:
  command-data:
  field-data:
